aid: blackbird-labs
name: Blackbird Labs
description: Blackbird Labs is a New York-based hospitality technology company building a payments and
  loyalty platform for restaurants and their guests. Its flagship product, Blackbird Pay, is a blockchain-powered
  payment network that charges restaurants roughly 2% per transaction and settles automatically at the
  table, while diners earn $FLY loyalty rewards by checking in and can redeem points across participating
  restaurants. Payments run over Flynet, a layer-three transaction protocol built on Coinbase's Base,
  and membership is represented by an NFC-tapped NFT. Founded by Resy and Eater co-founder Ben Leventhal,
  Blackbird is backed by Union Square Ventures, Spark Capital, Andreessen Horowitz, Coinbase Ventures,
  and Amex Ventures. Blackbird operates as a consumer mobile app and a merchant platform and does not
  currently publish a public developer API.
